name: Bazel CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: bazel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-policy:
    name: Check authors and signatures
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out submitted history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Validate commit policy
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA=$(git merge-base "origin/$DEFAULT_BRANCH" "$HEAD_SHA")
          elif ! git cat-file -e "$BASE_SHA^{commit}"; then
            git fetch --no-tags origin "$BASE_SHA"
          fi
          python3 github/ci_tools/check_authors.py \
            --revision "$BASE_SHA..$HEAD_SHA"
          python3 github/ci_tools/check_signatures.py \
            "$BASE_SHA..$HEAD_SHA"

  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure Bazelisk and caches
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-${{ runner.os }}
          repository-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}

      - name: Build all targets
        run: bazelisk build //...

      - name: Run all tests
        run: bazelisk test //...

  freebsd:
    name: Build and test (FreeBSD 15.1)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build and test in FreeBSD
        uses: vmactions/freebsd-vm@v1.5.2
        with:
          release: "15.1"
          usesh: true
          copyback: false
          run: sh github/ci_tools/bsd.sh

  openbsd:
    name: Build and test (OpenBSD 7.9)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build and test in OpenBSD
        uses: vmactions/openbsd-vm@v1.4.5
        with:
          release: "7.9"
          usesh: true
          copyback: false
          run: sh github/ci_tools/bsd.sh
