version = 1

# The empty sequence is the root fallback for committed UTF-8 text. Fixed C0
# interpretations are ordinary, user-overridable mappings below.
[[mapping]]
sequence = ""
kind = "protocol"
protocol = "TEXT"

[[mapping]]
sequence = "<ESC>"
kind = "protocol"
protocol = "ESCAPE"

# Escape followed by a colon is an application command, not an Alt-modified
# printable character. Keeping this in the input trie also makes the chord
# independent of the decoder's standalone-Escape timeout.
[[mapping]]
sequence = "<ESC>:"
kind = "command"
command = "ENTER_COMMAND_MODE"

# Escape followed by greater-than opens the embedded terminal surface. As with
# command mode, this belongs in the trie so it is independent of Escape timing.
[[mapping]]
sequence = "<ESC>>"
kind = "command"
command = "ENTER_TERMINAL_MODE"

[[mapping]]
sequence = "<ESC>O"
kind = "protocol"
protocol = "SS3"

[[mapping]]
sequence = "<CSI>"
kind = "protocol"
protocol = "CSI"

[[mapping]]
sequence = "<OSC>"
kind = "protocol"
protocol = "OSC"

[[mapping]]
sequence = "<DCS>"
kind = "protocol"
protocol = "DEVICE_CONTROL_STRING"

[[mapping]]
sequence = "<APC>"
kind = "protocol"
protocol = "APPLICATION_PROGRAM_COMMAND"

[[mapping]]
sequence = "<PM>"
kind = "protocol"
protocol = "PRIVACY_MESSAGE"

[[mapping]]
sequence = "<CSI><LT>"
kind = "protocol"
protocol = "SGR_MOUSE"

[[mapping]]
sequence = "<OSC>52;"
kind = "protocol"
protocol = "OSC52"

[[mapping]]
sequence = "<CSI>200~"
kind = "protocol"
protocol = "PASTE_BEGIN"

[[mapping]]
sequence = "<CSI>201~"
kind = "protocol"
protocol = "PASTE_END"

[[mapping]]
sequence = "<CSI>I"
kind = "focus"
focused = true

[[mapping]]
sequence = "<CSI>O"
kind = "focus"
focused = false

# Fixed C0 key interpretations. Terminals cannot distinguish several of these
# byte encodings (for example, Ctrl-I and Tab), so the defaults choose the
# traditional interpretation while leaving every path user-overridable.
[[mapping]]
sequence = "<NUL>"
kind = "key"
key = " "
modifiers = ["CONTROL"]

